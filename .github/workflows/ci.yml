on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        composer: [basic]
        include:
          - php: '8.0'
            composer: lowest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.php }}" == "8.0" ]]; then
            composer require phpstan/phpstan --no-update
          fi;

          if [[ "${{ matrix.composer }}" == "lowest" ]]; then
            composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable
          fi;

          if [[ "${{ matrix.composer }}" == "basic" ]]; then
            composer update --prefer-dist --no-interaction
          fi;

          composer dump-autoload -o

      - name: Run tests
        run: |
          mkdir -p build/logs
          php vendor/bin/phpunit -c phpunit.xml.dist --coverage-clover=build/logs/clover.xml

      - name: Run phpstan
        if: ${{ matrix.php == '8.3' && matrix.composer == 'basic' }}
        run: |
          php vendor/bin/phpstan analyse

      - name: Upload coverage results to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer global require php-coveralls/php-coveralls
          php-coveralls --coverage_clover=build/logs/clover.xml -v

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: build/logs/clover.xml

      - name: Archive logs artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs_composer-${{ matrix.composer }}_php-${{ matrix.php }}
          path: |
            build/logs

  mutation:
    # Infection 0.32.x requires PHP 8.3+; a full run takes ~12 minutes, so it gets its own job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '8.3'
          coverage: pcov
          extensions: zip
          tools: composer

      - name: Determine composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: 8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: 8.3-composer-

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction
          composer dump-autoload -o

      - name: Install Infection
        run: |
          curl --fail --silent --show-error --location \
            --output infection.phar \
            https://github.com/infection/infection/releases/download/0.32.7/infection.phar
          chmod +x infection.phar

      # MSI thresholds live in infection.json.dist (minMsi / minCoveredMsi).
      - name: Run Infection
        run: |
          php infection.phar --threads=max --no-progress --logger-github=false

      - name: Archive Infection logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: infection-logs
          path: |
            infection-log.txt
            infection-summary.txt
