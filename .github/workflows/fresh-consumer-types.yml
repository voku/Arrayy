name: Fresh consumer typing proof

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install as an independent Composer consumer
        run: |
          mkdir -p "$RUNNER_TEMP/arrayy-typing-consumer"
          cd "$RUNNER_TEMP/arrayy-typing-consumer"
          php <<'PHP'
          <?php
          $source = getenv('GITHUB_WORKSPACE');
          if (!$source || !is_dir($source)) {
              throw new RuntimeException('Missing source checkout');
          }
          $config = [
              'name' => 'arrayy/fresh-consumer-proof',
              'repositories' => [[
                  'type' => 'path',
                  'url' => $source,
                  'options' => [
                      'symlink' => false,
                      'versions' => ['voku/arrayy' => 'dev-pr-193'],
                  ],
              ]],
              'require' => [
                  'voku/arrayy' => 'dev-pr-193',
                  'phpstan/phpstan' => '2.3.1',
              ],
              'minimum-stability' => 'dev',
              'prefer-stable' => true,
          ];
          file_put_contents('composer.json', json_encode($config, JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          PHP
          composer update --no-interaction --prefer-dist --no-progress
          test -f vendor/voku/arrayy/src/Arrayy.php
          test ! -L vendor/voku/arrayy

      - name: Prove installed generics with PHPStan
        run: |
          cd "$RUNNER_TEMP/arrayy-typing-consumer"
          cat > consumer.php <<'PHP'
          <?php
          declare(strict_types=1);

          use Arrayy\Arrayy;
          use DateTimeImmutable;
          use function PHPStan\Testing\assertType;

          /**
           * @param Arrayy<int, DateTimeImmutable> $dates
           * @param list<DateTimeImmutable> $values
           */
          function useInstalledPackage(Arrayy $dates, array $values): void
          {
              assertType('DateTimeImmutable|null', $dates->first());
              assertType('int|null', $dates->firstKey());
              assertType('DateTimeImmutable|false', $dates->find(
                  static fn (DateTimeImmutable $date): bool => $date->getTimestamp() > 0
              ));
              assertType('array<int, DateTimeImmutable>', $dates->getAll());
              assertType('list<DateTimeImmutable>', $dates->toList());
              assertType('DateTimeImmutable|null', \Arrayy\array_first($values));
              assertType('DateTimeImmutable|null', \Arrayy\array_last($values));
              foreach ($dates->getIterator() as $value) {
                  assertType('DateTimeImmutable', $value);
              }
          }
          PHP
          php vendor/bin/phpstan analyse --no-progress --level=8 consumer.php
          php -r 'require "vendor/autoload.php"; $a = new \Arrayy\Arrayy([new \DateTimeImmutable("2025-01-01")]); if (!$a->first() instanceof \DateTimeImmutable) { exit(1); }'
